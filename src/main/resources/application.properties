spring.application.name=service-merchants

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/merchants}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:merchants}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:merchants}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info

server.port=${SERVER_PORT:8081}