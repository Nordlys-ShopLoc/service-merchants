spring:
  application:
    name: service-merchants

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/merchants}
    username: ${SPRING_DATASOURCE_USERNAME:merchants}
    password: ${SPRING_DATASOURCE_PASSWORD:merchants}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
